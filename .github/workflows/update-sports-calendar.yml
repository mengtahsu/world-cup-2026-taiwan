name: Update sports calendar
on:
  push:
    branches: [main]
    paths:
      - "sports-calendar/**"
      - "scripts/update-sports-calendar.mjs"
      - ".github/workflows/update-sports-calendar.yml"
  schedule:
    - cron: "42 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check GEMINI_API_KEY wiring (never prints the value)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY: present (length ${#GEMINI_API_KEY})"
          else
            echo "::warning::GEMINI_API_KEY is NOT set in repo secrets — script will use rule-based fallback"
          fi
      - run: node scripts/update-sports-calendar.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
      - name: Commit changed calendar
        run: |
          git config user.name "sports-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports-calendar/data.json
          git diff --cached --quiet || git commit -m "data: refresh sports calendar"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
